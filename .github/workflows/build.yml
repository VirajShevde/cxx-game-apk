name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.abi }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;25.1.8937393"


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.7

          wget -q \
            https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip

          unzip -q gradle-${GRADLE_VERSION}-bin.zip

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH


      - name: Check project files
        run: |
          echo "Checking required files..."

          test -f app/build.gradle
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/game57-4.cxx

          echo "All required files found."

          echo
          echo "Building ABI: ${{ matrix.abi }}"


      - name: Build APK
        working-directory: app
        run: |
          gradle clean assembleDebug \
            -Pandroid.injected.build.abi=${{ matrix.abi }} \
            --stacktrace


      - name: Show generated APK
        run: |
          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cxxgame-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
