name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          sdkmanager --install "cmake;3.22.1"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            perl \
            make \
            curl \
            tar \
            gzip

      - name: Download SDL2 and SDL2_image
        shell: bash
        run: |
          set -e

          cd app/src/main/cpp

          curl -L -o sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz

          tar -xzf sdl2.tar.gz

          rm -rf SDL2
          mv SDL2-2.28.5 SDL2
          rm -f sdl2.tar.gz

          curl -L -o sdl2_image.tar.gz \
            https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.1/SDL2_image-2.8.1.tar.gz

          tar -xzf sdl2_image.tar.gz

          rm -rf SDL2_image
          mv SDL2_image-2.8.1 SDL2_image
          rm -f sdl2_image.tar.gz

      - name: Copy SDL2 Java files
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/org/libsdl/app

          cp -R \
            app/src/main/cpp/SDL2/android-project/app/src/main/java/org/libsdl/app/. \
            app/src/main/java/org/libsdl/app/

      - name: Build OpenSSL for Android arm64-v8a
        shell: bash
        run: |
          set -e

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.1.8937393"
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export ANDROID_API=23

          export REAL_CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export REAL_CXX="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"

          test -x "$REAL_CC"
          test -x "$REAL_CXX"

          WRAPPER_DIR="/tmp/openssl-android-toolchain"

          rm -rf "$WRAPPER_DIR"
          mkdir -p "$WRAPPER_DIR"

          printf '%s\n' \
            '#!/bin/sh' \
            "exec \"$REAL_CC\" \"\$@\"" \
            > "$WRAPPER_DIR/aarch64-linux-android-gcc"

          printf '%s\n' \
            '#!/bin/sh' \
            "exec \"$REAL_CXX\" \"\$@\"" \
            > "$WRAPPER_DIR/aarch64-linux-android-g++"

          chmod +x "$WRAPPER_DIR/aarch64-linux-android-gcc"
          chmod +x "$WRAPPER_DIR/aarch64-linux-android-g++"

          export PATH="$WRAPPER_DIR:$TOOLCHAIN/bin:$PATH"

          echo "========================================"
          echo "OpenSSL compiler compatibility check"
          echo "========================================"

          command -v aarch64-linux-android-gcc
          command -v aarch64-linux-android-g++

          aarch64-linux-android-gcc --version

          export CC="$REAL_CC"
          export CXX="$REAL_CXX"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          cd /tmp

          rm -rf openssl-3.0.15
          rm -f openssl.tar.gz

          curl -L \
            -o openssl.tar.gz \
            https://www.openssl.org/source/openssl-3.0.15.tar.gz

          tar -xzf openssl.tar.gz

          cd openssl-3.0.15

          ./Configure \
            android-arm64 \
            -D__ANDROID_API__=${ANDROID_API} \
            no-shared \
            no-tests \
            --prefix="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"

          make -j"$(nproc)"

          make install_sw

      - name: Normalize OpenSSL library paths
        shell: bash
        run: |
          set -e

          OPENSSL_DIR="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"

          mkdir -p "$OPENSSL_DIR/lib"

          if [ -f "$OPENSSL_DIR/lib64/libssl.a" ]; then
            cp "$OPENSSL_DIR/lib64/libssl.a" \
               "$OPENSSL_DIR/lib/libssl.a"
          fi

          if [ -f "$OPENSSL_DIR/lib64/libcrypto.a" ]; then
            cp "$OPENSSL_DIR/lib64/libcrypto.a" \
               "$OPENSSL_DIR/lib/libcrypto.a"
          fi

      - name: Verify OpenSSL files
        shell: bash
        run: |
          set -e

          OPENSSL_DIR="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"

          echo "========================================"
          echo "OpenSSL files"
          echo "========================================"

          find "$OPENSSL_DIR" -type f | sort

          test -f "$OPENSSL_DIR/include/openssl/ssl.h"
          test -f "$OPENSSL_DIR/lib/libssl.a"
          test -f "$OPENSSL_DIR/lib/libcrypto.a"

          echo "OpenSSL verification successful"

      - name: Verify Java files
        shell: bash
        run: |
          set -e

          test -f app/src/main/java/com/example/cxxgame/MainActivity.java
          test -f app/src/main/java/org/libsdl/app/SDLActivity.java

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.5

          chmod +x gradlew

          ./gradlew \
            :app:clean \
            :app:assembleDebug \
            --warning-mode summary \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
