name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SDL2 and SDL2_image
        shell: bash
        run: |
          cd app/src/main/cpp

          curl -L -o sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
          tar -xzf sdl2.tar.gz
          rm -rf SDL2
          mv SDL2-2.28.5 SDL2
          rm sdl2.tar.gz

          curl -L -o sdl2_image.tar.gz \
            https://github.com/libsdl-org/SDL_image/releases/download/release-2.6.3/SDL2_image-2.6.3.tar.gz
          tar -xzf sdl2_image.tar.gz
          rm -rf SDL2_image
          mv SDL2_image-2.6.3 SDL2_image
          rm sdl2_image.tar.gz

          mkdir -p SDL2_headers/SDL2

          cp SDL2/include/*.h SDL2_headers/
          cp SDL2/include/*.h SDL2_headers/SDL2/

          cp SDL2_image/*.h SDL2_headers/ 2>/dev/null || true
          cp SDL2_image/*.h SDL2_headers/SDL2/ 2>/dev/null || true

      - name: Copy SDL2 Java files
        shell: bash
        run: |
          mkdir -p app/src/main/java/org/libsdl/app

          cp -R \
            app/src/main/cpp/SDL2/android-project/app/src/main/java/org/libsdl/app/. \
            app/src/main/java/org/libsdl/app/

      - name: Verify Java files
        shell: bash
        run: |
          test -f app/src/main/java/com/example/cxxgame/MainActivity.java
          test -f app/src/main/java/org/libsdl/app/SDLActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build APK
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleDebug --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
