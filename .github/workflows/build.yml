name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout repository
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # Java 17
      # =====================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # Android SDK
      # =====================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # =====================================================
      # Gradle
      # =====================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"


      # =====================================================
      # Android NDK + CMake
      # =====================================================
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -e

          sdkmanager --install "ndk;25.1.8937393"
          sdkmanager --install "cmake;3.22.1"


      # =====================================================
      # Linux build dependencies
      # =====================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            perl \
            make \
            curl \
            tar \
            gzip


      # =====================================================
      # Download SDL2 and SDL2_image
      # =====================================================
      - name: Download SDL2 and SDL2_image
        shell: bash
        run: |
          set -e

          cd app/src/main/cpp

          rm -rf SDL2
          rm -rf SDL2_image

          curl -L \
            -o sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz

          tar -xzf sdl2.tar.gz

          mv SDL2-2.28.5 SDL2

          rm -f sdl2.tar.gz

          curl -L \
            -o sdl2_image.tar.gz \
            https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.1/SDL2_image-2.8.1.tar.gz

          tar -xzf sdl2_image.tar.gz

          mv SDL2_image-2.8.1 SDL2_image

          rm -f sdl2_image.tar.gz


      # =====================================================
      # Copy SDL2 Android Java files
      # =====================================================
      - name: Copy SDL2 Java files
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/org/libsdl/app

          cp -R \
            app/src/main/cpp/SDL2/android-project/app/src/main/java/org/libsdl/app/. \
            app/src/main/java/org/libsdl/app/


      # =====================================================
      # Build OpenSSL for Android ARM64
      # =====================================================
      - name: Build OpenSSL for Android arm64-v8a
        shell: bash
        run: |
          set -e

          # -------------------------------------------------
          # Android NDK environment required by OpenSSL
          # -------------------------------------------------

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.1.8937393"

          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          export ANDROID_API=23

          # Put the NDK LLVM compiler directory first.
          export PATH="$TOOLCHAIN/bin:$PATH"


          echo "========================================"
          echo "OpenSSL Android configuration"
          echo "========================================"

          echo "ANDROID_NDK_ROOT:"
          echo "$ANDROID_NDK_ROOT"

          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo "TOOLCHAIN:"
          echo "$TOOLCHAIN"

          echo "ANDROID_API:"
          echo "$ANDROID_API"

          echo "clang found at:"
          command -v clang

          echo "clang version:"
          clang --version

          echo "========================================"


          # Verify NDK installation.

          test -d "$ANDROID_NDK_ROOT"

          test -d "$TOOLCHAIN"

          test -d "$TOOLCHAIN/bin"

          test -x "$TOOLCHAIN/bin/clang"

          test -x \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"


          # -------------------------------------------------
          # Download OpenSSL
          # -------------------------------------------------

          cd /tmp

          rm -rf openssl-3.0.15

          rm -f openssl.tar.gz


          curl -L \
            -o openssl.tar.gz \
            https://www.openssl.org/source/openssl-3.0.15.tar.gz


          tar -xzf openssl.tar.gz


          cd openssl-3.0.15


          # -------------------------------------------------
          # Configure OpenSSL
          # -------------------------------------------------

          ./Configure \
            android-arm64 \
            -D__ANDROID_API__=${ANDROID_API} \
            no-shared \
            no-tests \
            --prefix="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"


          # -------------------------------------------------
          # Build OpenSSL
          # -------------------------------------------------

          make -j"$(nproc)"


          # -------------------------------------------------
          # Install OpenSSL
          # -------------------------------------------------

          make install_sw


      # =====================================================
      # Normalize OpenSSL library location
      # =====================================================
      - name: Normalize OpenSSL library paths
        shell: bash
        run: |
          set -e

          OPENSSL_DIR="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"

          mkdir -p "$OPENSSL_DIR/lib"


          if [ -f "$OPENSSL_DIR/lib64/libssl.a" ]; then

            cp \
              "$OPENSSL_DIR/lib64/libssl.a" \
              "$OPENSSL_DIR/lib/libssl.a"

          fi


          if [ -f "$OPENSSL_DIR/lib64/libcrypto.a" ]; then

            cp \
              "$OPENSSL_DIR/lib64/libcrypto.a" \
              "$OPENSSL_DIR/lib/libcrypto.a"

          fi


      # =====================================================
      # Verify OpenSSL files required by CMakeLists.txt
      # =====================================================
      - name: Verify OpenSSL files
        shell: bash
        run: |
          set -e

          OPENSSL_DIR="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"


          echo "========================================"
          echo "OpenSSL output"
          echo "========================================"

          find "$OPENSSL_DIR" -type f | sort


          echo "========================================"
          echo "Checking required CMake files"
          echo "========================================"


          test -f \
            "$OPENSSL_DIR/include/openssl/ssl.h"


          test -f \
            "$OPENSSL_DIR/lib/libssl.a"


          test -f \
            "$OPENSSL_DIR/lib/libcrypto.a"


          echo "========================================"
          echo "OpenSSL verification successful"
          echo "========================================"


      # =====================================================
      # Verify Java files
      # =====================================================
      - name: Verify Java files
        shell: bash
        run: |
          set -e

          test -f \
            app/src/main/java/com/example/cxxgame/MainActivity.java


          test -f \
            app/src/main/java/org/libsdl/app/SDLActivity.java


      # =====================================================
      # Build APK
      # =====================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.5

          chmod +x gradlew

          ./gradlew \
            :app:clean \
            :app:assembleDebug \
            --warning-mode summary \
            --stacktrace


      # =====================================================
      # Upload APK
      # =====================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
