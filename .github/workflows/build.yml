name: Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;25.1.8937393"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Show project structure
        run: |
          echo "Working directory:"
          pwd
          echo
          echo "Project files:"
          find . -maxdepth 4 -type f | sort | head -300

      - name: Verify native source
        run: |
          test -f app/src/main/cpp/game57-4.cxx
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Native source found:"
          ls -lh app/src/main/cpp/game57-4.cxx
          echo
          echo "CMakeLists found:"
          ls -lh app/src/main/cpp/CMakeLists.txt

      - name: Check Gradle installation
        run: |
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cxxgame-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
