name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Setup SDL2 and SDL2_image
        run: |
          cd app/src/main/cpp
          
          # Download and extract SDL2
          curl -L -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
          tar -xzf sdl2.tar.gz
          rm -rf SDL2
          mv SDL2-2.28.5 SDL2
          rm sdl2.tar.gz

          # Download and extract SDL2_image
          curl -L -o sdl2_image.tar.gz https://github.com/libsdl-org/SDL_image/releases/download/release-2.6.3/SDL2_image-2.6.3.tar.gz
          tar -xzf sdl2_image.tar.gz
          rm -rf SDL2_image
          mv SDL2_image-2.6.3 SDL2_image
          rm sdl2_image.tar.gz

          # Bulletproof folder arrangement for SDL_image headers
          mkdir -p SDL2_image/include/SDL2
          cp SDL2_image/*.h SDL2_image/include/SDL2/ 2>/dev/null || true
          if [ -d "SDL2_image/include" ]; then
            cp SDL2_image/include/*.h SDL2_image/include/SDL2/ 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode summary

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
