name: Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;25.1.8937393"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Android toolchain
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          chmod +x ./gradlew
          ./gradlew --version

          echo "NDK:"
          ls "$ANDROID_SDK_ROOT/ndk/25.1.8937393"

          echo "CMake:"
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

      - name: Verify game source
        run: |
          test -f app/src/main/cpp/game57-4.cxx
          test -f app/src/main/cpp/CMakeLists.txt
          echo "game57-4.cxx found"
          echo "CMakeLists.txt found"

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cxxgame-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
