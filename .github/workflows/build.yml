name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.abi }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;25.1.8937393"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.7
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare SDL2
        run: |
          mkdir -p app/src/main/cpp

          gh release download release-2.28.5 \
            --repo libsdl-org/SDL \
            --pattern "SDL2-2.28.5.tar.gz" \
            --dir /tmp

          mkdir -p /tmp/sdl2
          tar -xzf /tmp/SDL2-2.28.5.tar.gz -C /tmp/sdl2 --strip-components=1

          rm -rf app/src/main/cpp/SDL2
          mkdir -p app/src/main/cpp/SDL2

          cp -a /tmp/sdl2/. app/src/main/cpp/SDL2/

      - name: Prepare SDL2_image
        run: |
          gh release download release-2.6.3 \
            --repo libsdl-org/SDL_image \
            --pattern "SDL2_image-2.6.3.tar.gz" \
            --dir /tmp

          mkdir -p /tmp/sdl2_image
          tar -xzf /tmp/SDL2_image-2.6.3.tar.gz \
            -C /tmp/sdl2_image \
            --strip-components=1

          rm -rf app/src/main/cpp/SDL2_image
          mkdir -p app/src/main/cpp/SDL2_image

          cp -a /tmp/sdl2_image/. app/src/main/cpp/SDL2_image/

      - name: Verify native files
        run: |
          test -f app/src/main/cpp/game57-4.cxx
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/SDL2/CMakeLists.txt
          test -f app/src/main/cpp/SDL2_image/CMakeLists.txt

          echo "ABI: ${{ matrix.abi }}"
          echo "SDL2 source: OK"
          echo "SDL2_image source: OK"
          echo "Game source: OK"

      - name: Build APK
        run: |
          gradle clean assembleDebug \
            -PABI=${{ matrix.abi }} \
            --stacktrace

      - name: Show APK
        run: |
          echo "APK for ${{ matrix.abi }}:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cxxgame-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
