name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # Java
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # =====================================================
      # Android SDK
      # =====================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true


      # =====================================================
      # Gradle
      # =====================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5


      # =====================================================
      # Android NDK / CMake
      # =====================================================

      - name: Install NDK and CMake
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"


      # =====================================================
      # Build OpenSSL 1.1.1w
      # =====================================================

      - name: Build OpenSSL 1.1.1w (${{ matrix.abi }})
        shell: bash
        run: |
          set -e

          git clone \
            --branch OpenSSL_1_1_1w \
            --depth 1 \
            https://github.com/openssl/openssl.git openssl

          cd openssl

          export API=23

          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          ABI="${{ matrix.abi }}"

          PREFIX="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/$ABI"

          mkdir -p "$PREFIX"

          echo "========================================"
          echo "ABI=$ABI"
          echo "PREFIX=$PREFIX"
          echo "========================================"

          if [ "$ABI" = "arm64-v8a" ]; then

            perl Configure android-arm64 \
              --cross-compile-prefix=aarch64-linux-android23- \
              -D__ANDROID_API__=$API \
              no-shared \
              no-tests \
              no-engine \
              no-comp \
              no-async \
              --prefix="$PREFIX"

          elif [ "$ABI" = "armeabi-v7a" ]; then

            perl Configure android-arm \
              --cross-compile-prefix=arm-linux-androideabi23- \
              -D__ANDROID_API__=$API \
              no-shared \
              no-tests \
              no-engine \
              no-comp \
              no-async \
              --prefix="$PREFIX"

          elif [ "$ABI" = "x86" ]; then

            perl Configure android-x86 \
              --cross-compile-prefix=i686-linux-android23- \
              -D__ANDROID_API__=$API \
              no-shared \
              no-tests \
              no-engine \
              no-comp \
              no-async \
              --prefix="$PREFIX"

          elif [ "$ABI" = "x86_64" ]; then

            perl Configure android-x86_64 \
              --cross-compile-prefix=x86_64-linux-android23- \
              -D__ANDROID_API__=$API \
              no-shared \
              no-tests \
              no-engine \
              no-comp \
              no-async \
              --prefix="$PREFIX"

          else

            echo "Unsupported ABI: $ABI"
            exit 1

          fi

          make -j"$(nproc)"

          make install_sw


      # =====================================================
      # Verify OpenSSL
      # =====================================================

      - name: Verify OpenSSL (${{ matrix.abi }})
        shell: bash
        run: |
          set -e

          OPENSSL_DIR="app/src/main/cpp/openssl/${{ matrix.abi }}"

          echo "Checking:"
          echo "$OPENSSL_DIR"

          test -f "$OPENSSL_DIR/lib/libssl.a"
          test -f "$OPENSSL_DIR/lib/libcrypto.a"

          test -d "$OPENSSL_DIR/include/openssl"

          echo ""
          echo "OpenSSL libraries:"
          ls -lh "$OPENSSL_DIR/lib/libssl.a"
          ls -lh "$OPENSSL_DIR/lib/libcrypto.a"

          echo ""
          echo "OpenSSL verification successful."


      # =====================================================
      # Download SDL2 / SDL2_image
      # =====================================================

      - name: Download SDL2 and SDL2_image
        run: |
          mkdir -p app/build/includes
          mkdir -p app/build/libs


      # =====================================================
      # Build APK
      # =====================================================

      - name: Build APK for ${{ matrix.abi }}
        shell: bash
        run: |
          echo "========================================"
          echo "Building ABI: ${{ matrix.abi }}"
          echo "========================================"

          gradle clean assembleDebug \
            -PABI="${{ matrix.abi }}" \
            --stacktrace


      # =====================================================
      # Show APK
      # =====================================================

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print


      # =====================================================
      # Upload APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
