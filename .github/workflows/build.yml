name: Build Android APK

on:
  push:


jobs:

  build:

    runs-on: ubuntu-latest


    strategy:

      matrix:

        abi:

          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64



    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Set up Android SDK
        uses: android-actions/setup-android@v3



      - name: Set up Java
        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "17"



      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: "8.5"



      # =====================================================
      # Build OpenSSL 1.1.1w
      # =====================================================

      - name: Build OpenSSL 1.1.1w (${{ matrix.abi }})
        shell: bash

        run: |

          set -e


          git clone \
            --depth 1 \
            --branch OpenSSL_1_1_1w \
            https://github.com/openssl/openssl.git


          cd openssl



          export API=23


          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin


          export PATH=$TOOLCHAIN:$PATH



          ABI=${{ matrix.abi }}



          if [ "$ABI" = "arm64-v8a" ]; then

              TARGET=android-arm64


          elif [ "$ABI" = "armeabi-v7a" ]; then

              TARGET=android-arm


          elif [ "$ABI" = "x86" ]; then

              TARGET=android-x86


          elif [ "$ABI" = "x86_64" ]; then

              TARGET=android-x86_64


          else

              echo "Unsupported ABI"

              exit 1

          fi



          PREFIX=$GITHUB_WORKSPACE/app/src/main/cpp/openssl/$ABI



          echo "Building OpenSSL:"
          echo "ABI=$ABI"
          echo "TARGET=$TARGET"
          echo "PREFIX=$PREFIX"



          perl Configure \

              $TARGET \

              -D__ANDROID_API__=$API \

              no-shared \

              no-tests \

              no-engine \

              no-comp \

              no-async \

              --prefix=$PREFIX



          make -j$(nproc)


          make install_sw



      # =====================================================
      # SDL2 + SDL2_image
      # =====================================================

      - name: Download SDL2 and SDL2_image

        shell: bash

        run: |

          cd app/src/main/cpp



          curl -L -o sdl2.tar.gz \

          https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz



          tar -xzf sdl2.tar.gz


          rm -rf SDL2


          mv SDL2-2.28.5 SDL2


          rm sdl2.tar.gz



          curl -L -o sdl2_image.tar.gz \

          https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.1/SDL2_image-2.8.1.tar.gz



          tar -xzf sdl2_image.tar.gz


          rm -rf SDL2_image


          mv SDL2_image-2.8.1 SDL2_image


          rm sdl2_image.tar.gz




      # =====================================================
      # SDL Java files
      # =====================================================

      - name: Copy SDL2 Java files

        shell: bash

        run: |


          mkdir -p app/src/main/java/org/libsdl/app


          cp -R \

          app/src/main/cpp/SDL2/android-project/app/src/main/java/org/libsdl/app/. \

          app/src/main/java/org/libsdl/app/



      - name: Verify Java files

        shell: bash

        run: |

          test -f app/src/main/java/com/example/cxxgame/MainActivity.java

          test -f app/src/main/java/org/libsdl/app/SDLActivity.java




      # =====================================================
      # Build APK
      # =====================================================

      - name: Build APK

        shell: bash

        run: |


          gradle wrapper --gradle-version 8.5


          chmod +x gradlew


          ./gradlew :app:clean :app:assembleDebug --warning-mode summary




      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: app-debug-${{ matrix.abi }}

          path: app/build/outputs/apk/debug/app-debug.apk
