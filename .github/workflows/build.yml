name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # Java
      # =====================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # Android SDK
      # =====================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # =====================================================
      # Gradle
      # =====================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"


      # =====================================================
      # Android NDK + CMake
      # =====================================================

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          sdkmanager --install "cmake;3.22.1"


      # =====================================================
      # System packages required for OpenSSL
      # =====================================================

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            perl \
            make \
            curl \
            tar \
            gzip


      # =====================================================
      # Download SDL2
      # =====================================================

      - name: Download SDL2 and SDL2_image
        shell: bash
        run: |
          set -e

          cd app/src/main/cpp

          curl -L -o sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz

          tar -xzf sdl2.tar.gz

          rm -rf SDL2

          mv SDL2-2.28.5 SDL2

          rm -f sdl2.tar.gz


          curl -L -o sdl2_image.tar.gz \
            https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.1/SDL2_image-2.8.1.tar.gz

          tar -xzf sdl2_image.tar.gz

          rm -rf SDL2_image

          mv SDL2_image-2.8.1 SDL2_image

          rm -f sdl2_image.tar.gz


      # =====================================================
      # Copy SDL2 Java files
      # =====================================================

      - name: Copy SDL2 Java files
        shell: bash
        run: |
          set -e

          mkdir -p \
            app/src/main/java/org/libsdl/app

          cp -R \
            app/src/main/cpp/SDL2/android-project/app/src/main/java/org/libsdl/app/. \
            app/src/main/java/org/libsdl/app/


      # =====================================================
      # Build OpenSSL for Android ARM64
      #
      # Output required by CMake:
      #
      # openssl/arm64-v8a/include/openssl/ssl.h
      # openssl/arm64-v8a/lib/libssl.a
      # openssl/arm64-v8a/lib/libcrypto.a
      # =====================================================

      - name: Build OpenSSL for Android arm64-v8a
        shell: bash
        run: |
          set -e

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.1.8937393"

          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          export ANDROID_API=23

          export PATH="$TOOLCHAIN/bin:$PATH"


          echo "========================================"
          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo "Toolchain:"
          echo "$TOOLCHAIN"

          echo "API:"
          echo "$ANDROID_API"

          echo "========================================"


          # Verify the real NDK compiler exists.

          test -f \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"

          test -f \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"


          # OpenSSL android-arm64 configuration expects
          # aarch64-linux-android-gcc.
          #
          # NDK r25 uses clang instead, so provide
          # compatibility compiler names.

          mkdir -p /tmp/openssl-toolchain

          ln -sf \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" \
            /tmp/openssl-toolchain/aarch64-linux-android-gcc

          ln -sf \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            /tmp/openssl-toolchain/aarch64-linux-android-g++

          export PATH="/tmp/openssl-toolchain:$PATH"


          echo "Compiler check:"

          command -v aarch64-linux-android-gcc

          command -v aarch64-linux-android-g++

          aarch64-linux-android-gcc --version


          # Clean any previous OpenSSL build.

          cd /tmp

          rm -rf \
            openssl-3.0.15 \
            openssl.tar.gz


          # Download OpenSSL.

          curl -L \
            -o openssl.tar.gz \
            https://www.openssl.org/source/openssl-3.0.15.tar.gz


          tar -xzf openssl.tar.gz


          cd openssl-3.0.15


          # Configure OpenSSL for Android ARM64.

          ./Configure \
            android-arm64 \
            -D__ANDROID_API__=${ANDROID_API} \
            no-shared \
            no-tests \
            --prefix="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"


          # Build.

          make -j"$(nproc)"


          # Install headers and static libraries.

          make install_sw


      # =====================================================
      # Normalize OpenSSL output
      #
      # Some OpenSSL configurations may use lib64.
      # Your CMakeLists requires lib/.
      # =====================================================

      - name: Normalize OpenSSL library paths
        shell: bash
        run: |
          set -e

          OPENSSL_DIR="$GITHUB_WORKSPACE/app/src/main/cpp/openssl/arm64-v8a"

          mkdir -p "$OPENSSL_DIR/lib"


          if [ -f "$OPENSSL_DIR/lib64/libssl.a" ]; then

           
