plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cxxgame'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.cxxgame"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    preBuild.dependsOn 'setupSDL2Files'
}

task downloadSDL2AndImage {
    doLast {
        def cppDir = new File(project.projectDir, "src/main/cpp")

        def sdl2Dir = new File(cppDir, "SDL2")
        def imageDir = new File(cppDir, "SDL2_image")

        def downloadDir = new File(project.buildDir, "downloads")
        downloadDir.mkdirs()

        /*
         * SDL2
         */
        def sdl2Version = "2.28.5"
        def sdl2Archive = new File(
                downloadDir,
                "SDL2-${sdl2Version}.tar.gz"
        )

        def sdl2Url =
                "https://github.com/libsdl-org/SDL/releases/download/release-${sdl2Version}/SDL2-${sdl2Version}.tar.gz"

        if (!sdl2Dir.exists()) {
            println "Downloading SDL2 ${sdl2Version}..."

            if (!sdl2Archive.exists()) {
                new URL(sdl2Url).withInputStream { input ->
                    sdl2Archive.withOutputStream { output ->
                        output << input
                    }
                }
            }

            def extractDir = new File(
                    downloadDir,
                    "SDL2-${sdl2Version}"
            )

            if (!extractDir.exists()) {
                exec {
                    commandLine(
                            "tar",
                            "-xzf",
                            sdl2Archive.absolutePath,
                            "-C",
                            downloadDir.absolutePath
                    )
                }
            }

            if (extractDir.exists()) {
                copy {
                    from extractDir
                    into sdl2Dir
                }
            }
        }

        /*
         * SDL2_image
         */
        def imageVersion = "2.6.3"
        def imageArchive = new File(
                downloadDir,
                "SDL2_image-${imageVersion}.tar.gz"
        )

        def imageUrl =
                "https://github.com/libsdl-org/SDL_image/releases/download/release-${imageVersion}/SDL2_image-${imageVersion}.tar.gz"

        if (!imageDir.exists()) {
            println "Downloading SDL2_image ${imageVersion}..."

            if (!imageArchive.exists()) {
                new URL(imageUrl).withInputStream { input ->
                    imageArchive.withOutputStream { output ->
                        output << input
                    }
                }
            }

            def extractDir = new File(
                    downloadDir,
                    "SDL2_image-${imageVersion}"
            )

            if (!extractDir.exists()) {
                exec {
                    commandLine(
                            "tar",
                            "-xzf",
                            imageArchive.absolutePath,
                            "-C",
                            downloadDir.absolutePath
                    )
                }
            }

            if (extractDir.exists()) {
                copy {
                    from extractDir
                    into imageDir
                }
            }
        }

        println "SDL2 and SDL2_image source prepared."
    }
}

task setupSDL2Files {
    dependsOn downloadSDL2AndImage

    doLast {
        def cppDir = new File(project.projectDir, "src/main/cpp")

        def sdl2Dir = new File(cppDir, "SDL2")
        def imageDir = new File(cppDir, "SDL2_image")

        if (!sdl2Dir.exists()) {
            throw new GradleException(
                    "SDL2 source directory was not created: ${sdl2Dir}"
            )
        }

        if (!imageDir.exists()) {
            throw new GradleException(
                    "SDL2_image source directory was not created: ${imageDir}"
            )
        }

        println "=========================================="
        println "SDL2 source: ${sdl2Dir}"
        println "SDL2_image source: ${imageDir}"
        println "SDL2 setup complete"
        println "=========================================="
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
