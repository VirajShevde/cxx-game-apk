plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cxxgame'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.cxxgame"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""

                arguments "-DANDROID_STL=c++_shared",
                          "-DSDL2_INCLUDE_DIR=${project.buildDir}/includes/SDL2",
                          "-DSDL2_LIB_DIR=${project.buildDir}/libs/SDL2"
            }
        }
    }

    // GitHub Actions passes:
    // -PABI=arm64-v8a
    // -PABI=armeabi-v7a
    // -PABI=x86
    // -PABI=x86_64

    def selectedAbi = project.findProperty("ABI")

    if (selectedAbi != null) {
        ndk {
            abiFilters selectedAbi
        }
    } else {
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"

            if (selectedAbi != null) {
                arguments "-DANDROID_ABI=${selectedAbi}"
            }
        }
    }
}
